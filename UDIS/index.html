<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDIS - University Department Information System</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="loginPage">
  <div class="card login">
    <h1>UDIS</h1><p class="sub">University Department Information System<br>C.V. Raman Global University - CSE</p>
    <label>Role</label>
    <select id="role"><option value="student">Student</option><option value="faculty">Faculty</option><option value="admin">Administrator</option><option value="hod">Head of Department</option></select>
    <label>Username</label><input id="user" placeholder="e.g. student1">
    <label>Password</label><input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button><p id="err" class="err"></p>
    <p class="hint">Demo logins: student1 / faculty1 / admin1 / hod1 - password: <b>1234</b></p>
  </div>
</section>
<section id="app" class="hidden">
  <header><b>UDIS</b><span id="who"></span><button class="out" onclick="logout()">Logout</button></header>
  <div class="layout"><nav id="menu"></nav><main id="content"></main></div>
</section>
<script src="script.js"></script></body></html>
